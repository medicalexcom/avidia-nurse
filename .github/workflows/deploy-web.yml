name: Deploy web preview

# Publishes the Expo web build to GitHub Pages on every push to main, so the
# app can be tested in a browser without any local setup.
# URL: https://medicalexcom.github.io/avidia-nurse/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Corepack is not enabled on every hosted Node 22 image. Install pnpm
      # explicitly so subsequent steps never depend on the runner PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle for Pages sub-path
        run: pnpm run build:web
        env:
          EXPO_BASE_URL: /avidia-nurse
          EXPO_PUBLIC_APP_ENV: preview
          # Public, non-secret — this deployment's own URL, per .env.example.
          # Used to build the password-recovery redirect link (recoveryLink.ts);
          # without it, resetPasswordForEmail can't recover this build's
          # /avidia-nurse sub-path from window.location alone.
          EXPO_PUBLIC_WEB_APP_URL: https://medicalexcom.github.io/avidia-nurse
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Add SPA fallback for client-side routes
        # GitHub Pages serves 404.html for unknown paths; serving the app shell
        # there lets expo-router handle deep links like /sign-in on refresh.
        run: cp apps/app/dist/index.html apps/app/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
