name: Document Processing Worker

# Runs the existing apps/worker background pipeline (M4 extraction -> M5
# indexing/embeddings -> M6 concept extraction -> M7 question generation) on
# a schedule, using `start:once` (drain both queues once, then exit) rather
# than the long-running poll loop, since GitHub Actions runners are
# ephemeral. This is intentionally the same worker source used for local
# development (supabase/README.md) — no logic is duplicated or reimplemented
# here, only its execution trigger changes from "someone's laptop" to CI.
#
# Requires three REPOSITORY SECRETS (Settings -> Secrets and variables ->
# Actions -> Secrets), never Variables: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# OPENAI_API_KEY. Until all three are set, this workflow will fail fast at the
# "Run worker" step with the same guard error the local worker raises
# (see packages/rag/src/embedding.ts, packages/knowledge/src/gateway.ts,
# packages/assessment/src/gateway.ts) rather than silently doing nothing.
#
# Cadence: every 5 minutes (tightened from 15 as part of the Ask Avidia fix —
# interactive tutor chat needs a materially shorter worst-case wait than
# document processing does). Adjust further if beta-scale usage needs
# tighter latency still or if GitHub Actions minutes become a cost concern;
# the worker's own stale-job recovery (processor.ts / indexer.ts /
# knowledge.ts / questions.ts) means a missed or overlapping run is always
# safe to retry. This schedule is still not a substitute for real
# interactive latency — see docs/ASK_AVIDIA_LATENCY.md for the known
# limitation and the recommended next step (a Supabase Edge Function or
# always-on process) if sub-minute replies become a hard requirement.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: document-processing-worker
  cancel-in-progress: false

jobs:
  run-worker:
    name: Drain document processing queues
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm must be on PATH before actions/setup-node@v5 runs: setup-node
      # auto-detects the "packageManager" field in package.json and invokes
      # pnpm directly, which previously failed every run with "Unable to
      # locate executable file: pnpm" because pnpm wasn't installed yet.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run worker (drain once)
        run: pnpm --filter @avidia/worker start:once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
